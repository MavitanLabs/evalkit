[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="evalkit"
version="0.1.0"
description="Run repeatable, dataset-backed evaluations against local agent outputs."
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
dependencies=[]
[project.scripts]
evalkit="evalkit.cli:main"
[tool.setuptools.packages.find]
include=["evalkit*"]
